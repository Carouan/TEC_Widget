name: Android APK

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - '.github/workflows/android-release.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - name: Verify release build refuses missing signing material
        working-directory: android
        shell: bash
        run: |
          set +e
          gradle assembleRelease > "$RUNNER_TEMP/release-without-signing.log" 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Release build unexpectedly succeeded without signing configuration." >&2
            exit 1
          fi
          grep -q "Release signing is not configured" "$RUNNER_TEMP/release-without-signing.log"
      - uses: actions/upload-artifact@v4
        with:
          name: tec-widget-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
