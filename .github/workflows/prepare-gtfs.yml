name: Prepare TEC GTFS

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and compact official TEC GTFS
        run: npm run prepare:gtfs
      - name: Build PWA with compact schedules
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: tec-widget-with-current-gtfs
          path: dist/
