name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run test:syntax
      - run: npm run test:planner
      - run: npm run test:gtfs
      - run: npm run build
      - name: Validate Digital Asset Links generation
        env:
          ANDROID_CERT_SHA256: '00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00'
        run: |
          node scripts/generate-assetlinks.mjs
          node -e "const x=require('fs').readFileSync('dist/.well-known/assetlinks.json','utf8'); JSON.parse(x);"
