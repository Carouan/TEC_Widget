name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run test:syntax
      - run: npm run test:planner
      - run: npm run test:gtfs
      - name: Audit line 9 around 07:44-07:45
        run: python scripts/prepare_gtfs.py --download --audit-profile outbound --audit-date 2026-09-08 --audit-from 07:40 --audit-to 07:50
      - run: npm run build
