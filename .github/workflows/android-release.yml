name: Android Release

on:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate tag and signing configuration
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          VERSION_NAME="$(grep '^VERSION_NAME=' android/version.properties | cut -d= -f2-)"
          TAG_VERSION="${GITHUB_REF_NAME#android-v}"
          test -n "$VERSION_NAME"
          test "$VERSION_NAME" = "$TAG_VERSION" || {
            echo "Tag $GITHUB_REF_NAME does not match VERSION_NAME=$VERSION_NAME" >&2
            exit 1
          }
          for value in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_CERT_SHA256; do
            test -n "${!value:-}" || { echo "Missing required signing configuration: $value" >&2; exit 1; }
          done

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/tec-widget-release.jks"
          chmod 600 "$RUNNER_TEMP/tec-widget-release.jks"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/tec-widget-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Verify certificate and prepare release assets
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          ACTUAL_CERT_SHA256="$($APKSIGNER verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          EXPECTED_NORMALIZED="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          ACTUAL_NORMALIZED="$(printf '%s' "$ACTUAL_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$ACTUAL_NORMALIZED"
          test "$ACTUAL_NORMALIZED" = "$EXPECTED_NORMALIZED" || {
            echo "Release certificate fingerprint does not match ANDROID_CERT_SHA256" >&2
            exit 1
          }

          VERSION_NAME="$(grep '^VERSION_NAME=' android/version.properties | cut -d= -f2-)"
          mkdir -p release-assets
          cp "$APK" "release-assets/TEC-Widget-${VERSION_NAME}.apk"
          (cd release-assets && sha256sum "TEC-Widget-${VERSION_NAME}.apk" > "TEC-Widget-${VERSION_NAME}.apk.sha256")

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_NAME="$(grep '^VERSION_NAME=' android/version.properties | cut -d= -f2-)"
          gh release create "$GITHUB_REF_NAME" \
            "release-assets/TEC-Widget-${VERSION_NAME}.apk" \
            "release-assets/TEC-Widget-${VERSION_NAME}.apk.sha256" \
            --title "TEC Widget Android ${VERSION_NAME}" \
            --generate-notes \
            --verify-tag
